services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - adamix-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4200
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      SEED_KEEP_DATA: ${SEED_KEEP_DATA:-false}
      CLIENT_URL: ${CLIENT_URL}
      API_URL: ${API_URL}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_LOGIN: ${SMTP_LOGIN}
    volumes:
      - videos:/repo/apps/backend/uploads/videos
      - avatars:/repo/apps/backend/uploads/avatars
      - banners:/repo/apps/backend/uploads/banners
      - thumbnails:/repo/apps/backend/uploads/thumbnails
    depends_on:
      db:
        condition: service_healthy
    networks:
      - adamix-net
      - dokploy-network
    expose:
      - 4200
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(''http'').get(''http://127.0.0.1:4200/api'', r => process.exit(r.statusCode < 500 ? 0 : 1)).on(''error'', () => process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        SERVER_URL: http://backend:4200
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVER_URL: http://backend:4200
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - adamix-net
      - dokploy-network
    expose:
      - 3000

networks:
  adamix-net:
  dokploy-network:
    external: true

volumes:
  pgdata:
  videos:
  avatars:
  banners:
  thumbnails:
